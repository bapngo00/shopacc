spring.application.name=web

# Database - Sử dụng biến môi trường từ platform
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/web}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Server Port - Railway/Render tự động set PORT env variable
server.port=${PORT:8080}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google Drive (nếu cần)
gdrive.service-account-key-path=classpath:todo-list-475513-a9f849b5d280.json
gdrive.parent-folder-id=0AFuDj2IFCqntUk9PVA

# Logging
logging.level.root=INFO
logging.level.com.example.web=DEBUG
