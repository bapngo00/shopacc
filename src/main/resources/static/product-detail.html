<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>

    <style>
        body {
            margin: 0;
            background: #f3f4f6;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 0;
        }

        .top-bar .container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #9ca3af;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #6b7280;
        }

        .social-icons svg {
            width: 20px;
            height: 20px;
        }

        .hotline {
            color: #9ca3af;
            font-size: 14px;
        }

        /* ===== HEADER ===== */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 15px 0;
        }

        .header .container {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .logo {
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .logo:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transform: scale(1.05);
        }

        .nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        /* ===== MAIN ===== */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        /* ===== TOP ===== */
        .top {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        .price-box {
            border-right: 1px dashed #e5e7eb;
            padding-right: 30px;
        }

        .ms {
            color: #6b7280;
            font-weight: 600;
        }

        .price {
            font-size: 34px;
            font-weight: 800;
            color: #ef4444;
            margin: 12px 0;
        }

        .buy-btn {
            display: block;
            text-align: center;
            padding: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
        }

        /* ===== INFO ===== */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info {
            background: #f9fafb;
            border-radius: 12px;
            padding: 15px;
        }

        .info span {
            font-size: 13px;
            color: #6b7280;
        }

        .info strong {
            display: block;
            margin-top: 4px;
            font-size: 16px;
            color: #111827;
        }

        /* ===== NỔI BẬT (CHỮ TO HƠN) ===== */
        .highlight {
            margin-top: 35px;
            padding: 28px;
            border-radius: 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
        }

        .highlight-title {
            font-size: 20px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 18px;
        }

        .highlight-list div {
            font-size: 19px;
            /* ⬅️ TO GẦN BẰNG TIÊU ĐỀ */
            color: #111827;
            line-height: 1.8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* ===== IMAGES ===== */
        .images {
            margin-top: 40px;
        }

        .images img {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }

        /* ===== RELATED ACCOUNTS ===== */
        .related-section {
            margin-top: 50px;
        }

        .related-title {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 15px;
        }

        .related-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: #111827;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .related-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .related-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .related-card-thumb {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
        }

        .related-card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .related-ms-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
        }

        .related-card-body {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .related-card-footer {
            background: #e0f2fe;
            padding: 12px 15px;
            font-size: 13px;
            color: #0369a1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .related-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            flex: 1;
        }

        .related-detail-item {
            font-size: 13px;
        }

        .related-detail-label {
            color: #6b7280;
            font-weight: 600;
        }

        .related-detail-value {
            color: #111827;
            font-weight: 500;
        }

        .related-price-box {
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .related-btn-detail {
            background: #1abc9c;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            transition: 0.3s;
        }

        .related-btn-detail:hover {
            background: #16a085;
        }
    </style>
</head>

<body>

    <!-- Top Bar với Social Icons và Hotline -->
    <div class="top-bar">
        <div class="container">
            <div class="social-icons">
                <a href="https://www.facebook.com/baonguyen.nguyenba" target="_blank" title="Facebook">
                    <svg fill="#9ca3af" viewBox="0 0 24 24">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                </a>
                <a href="#" target="_blank" title="YouTube">
                    <svg fill="#9ca3af" viewBox="0 0 24 24">
                        <path
                            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                </a>
            </div>
            <div class="hotline">Hotline: <a href="https://zalo.me/0377709859"
                    style="color: #9ca3af; text-decoration: none;">0377709859</a> (8h-20h)</div>
        </div>
    </div>

    <div class="header">
        <div class="container">
            <a href="index.html" class="logo">T1NSOSHOP</a>
            <div class="nav">
                <a href="index.html">Trang chủ</a>
                <a href="#" onclick="logout()">Đăng xuất</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card" id="content" style="display:none">

            <div class="top">
                <div class="price-box">
                    <div class="ms" id="msCode">#MS</div>
                    <div class="price" id="price">0đ</div>
                    <a id="buyBtn" class="buy-btn" target="_blank">MUA NGAY</a>
                </div>

                <div class="info-grid">
                    <div class="info"><span>SERVER</span><strong id="server"></strong></div>
                    <div class="info"><span>CLASS</span><strong id="className"></strong></div>
                    <div class="info"><span>LEVEL</span><strong id="level"></strong></div>
                    <div class="info"><span>TTGT</span><strong id="ttgt"></strong></div>
                </div>
            </div>

            <!-- NỔI BẬT -->
            <div class="highlight" id="highlightBox">
                <div class="highlight-title">THÔNG TIN NỔI BẬT</div>
                <div class="highlight-list" id="highlight"></div>
            </div>

            <div class="images" id="images"></div>

            <!-- TÀI KHOẢN LIÊN QUAN -->
            <div class="related-section">
                <h2 class="related-title">TÀI KHOẢN LIÊN QUAN</h2>
                <div class="related-grid" id="relatedAccounts"></div>
            </div>
        </div>
    </div>

    <script>
        const id = new URLSearchParams(location.search).get("id");

        fetch(`/api/products/${id}`)
            .then(r => r.json())
            .then(p => {
                content.style.display = "block";
                msCode.textContent = p.msCode;
                price.textContent = Number(p.price).toLocaleString() + "đ";
                server.textContent = p.server;
                className.textContent = p.className;
                level.textContent = p.level;
                ttgt.textContent = p.ttgt;
                buyBtn.href = "https://www.facebook.com/baonguyen.nguyenba";

                if (p.highlightInfo) {
                    highlight.innerHTML = p.highlightInfo
                        .split(/[,|\n]/)
                        .map(x => `<div>${x.trim()}</div>`)
                        .join("");
                } else {
                    highlightBox.style.display = "none";
                }

                // Lấy ảnh từ imgData
                let imgs = [];
                if (p.imgData) {
                    try {
                        // Thử parse JSON array
                        const parsed = JSON.parse(p.imgData);
                        if (Array.isArray(parsed)) {
                            imgs = parsed;
                        } else if (typeof parsed === 'string') {
                            imgs = [parsed];
                        }
                    } catch (e) {
                        // Nếu không parse được, coi như string đơn
                        imgs = [p.imgData];
                    }
                }

                // Hiển thị ảnh (ảnh được lưu dạng Base64 trong database)
                if (imgs.length > 0) {
                    images.innerHTML = imgs.map(i => `<img src="${i}" alt="Product image">`).join("");
                } else {
                    images.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 40px;">Chưa có ảnh sản phẩm</p>';
                }

                // Load related accounts
                loadRelatedAccounts(p);
            });

        async function loadRelatedAccounts(currentProduct) {
            try {
                const res = await fetch('/api/products');
                const allProducts = await res.json();

                // Filter: exclude current product and sold products
                const availableProducts = allProducts.filter(p =>
                    p.id !== currentProduct.id && !p.sold
                );

                // Tìm tài khoản có giá tương đương (tầm giá ±30%)
                const currentPrice = currentProduct.price || 0;
                const priceRange = currentPrice * 0.3; // 30% của giá hiện tại
                const minPrice = currentPrice - priceRange;
                const maxPrice = currentPrice + priceRange;

                let related = availableProducts.filter(p => {
                    const price = p.price || 0;
                    return price >= minPrice && price <= maxPrice;
                });

                // Nếu không có tài khoản tầm giá, random từ tất cả sản phẩm
                if (related.length === 0) {
                    // Shuffle array và lấy 4 sản phẩm đầu tiên
                    related = availableProducts.sort(() => Math.random() - 0.5);
                }

                // Giới hạn tối đa 4 sản phẩm
                related = related.slice(0, 4);

                const container = document.getElementById('relatedAccounts');

                if (related.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #6b7280;">Không có tài khoản liên quan</div>';
                    return;
                }

                container.innerHTML = related.map(p => {
                    // Lấy logo image (ưu tiên logoImage, nếu không có thì lấy ảnh đầu tiên từ imgData)
                    let logoImg = p.logoImage || '';
                    if (!logoImg && p.imgData) {
                        try {
                            const parsed = JSON.parse(p.imgData);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                logoImg = parsed[0];
                            } else if (typeof parsed === 'string') {
                                logoImg = parsed;
                            }
                        } catch (e) {
                            logoImg = p.imgData || '';
                        }
                    }

                    return `
                    <div class="related-card" onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="related-card-thumb">
                            <img src="${logoImg}" alt="${p.msCode || 'Product'}">
                            <span class="related-ms-tag">MS: ${p.msCode || 'N/A'}</span>
                        </div>
                        <div class="related-card-footer">${p.title || ''}</div>
                        <div class="related-card-body">
                            <div class="related-details">
                                <div class="related-detail-item">
                                    <span class="related-detail-label">Server:</span>
                                    <span class="related-detail-value">${p.server || 'N/A'}</span>
                                </div>
                                <div class="related-detail-item">
                                    <span class="related-detail-label">Class:</span>
                                    <span class="related-detail-value">${p.className || 'N/A'}</span>
                                </div>
                                <div class="related-detail-item">
                                    <span class="related-detail-label">Level:</span>
                                    <span class="related-detail-value">${p.level || 'N/A'}</span>
                                </div>
                                <div class="related-detail-item">
                                    <span class="related-detail-label">TTGT:</span>
                                    <span class="related-detail-value">${p.ttgt || 'Không'}</span>
                                </div>
                            </div>
                            <div class="related-price-box">${Number(p.price || 0).toLocaleString()}₫</div>
                            <button class="related-btn-detail" onclick="event.stopPropagation(); window.location.href='product-detail.html?id=${p.id}'">Chi tiết</button>
                        </div>
                    </div>
                `;
                }).join('');
            } catch (err) {
                console.error("Lỗi tải tài khoản liên quan:", err);
            }
        }

        function logout() {
            localStorage.removeItem("token");
            location.href = "index.html";
        }
    </script>

</body>

</html>
